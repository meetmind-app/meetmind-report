name: Web Report v1.1 Visual

on:
  push:
    branches:
      - report-v1.1-consumers
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'report-v1.1*.js'
      - 'report-v1.1*.css'
      - 'Tests/web-report-v1.1-visual.js'
      - 'Tests/web-report-e2e-corpus.js'
      - 'Tests/web-report-language-matrix.js'
      - 'Tests/fixtures/**'
      - '.github/workflows/web-report-v1.1-visual.yml'

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/lorevi-web.log 2>&1 &
          echo $! > /tmp/lorevi-web.pid
          sleep 2

      - name: Run browser visual regression
        run: node Tests/web-report-v1.1-visual.js

      - name: Run shared E2E contract corpus
        run: node Tests/web-report-e2e-corpus.js

      - name: Run ten-language browser matrix
        run: node Tests/web-report-language-matrix.js

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-report-v1.1-visual
          path: Tests/artifacts/web-report-v1.1-ru.png
          if-no-files-found: warn
          retention-days: 14
