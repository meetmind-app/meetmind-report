name: Web Report v1.1

on:
  push:
    branches:
      - report-v1.1-consumers
  pull_request:
    paths:
      - 'app.js'
      - 'pdf.js'
      - 'index.html'
      - 'styles.css'
      - 'report-v1.1*.js'
      - 'report-v1.1*.css'
      - 'Tests/**'
      - '.github/workflows/web-report-v1.1.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Web Report v1.1 regression
        run: node Tests/web-report-v1.1.test.js
